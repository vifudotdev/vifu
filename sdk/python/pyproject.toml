[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vifu"
version = "0.1.4"
description = "Embed Vifu Runtime, Gateway, and local Server in Python agent applications."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Vifu Contributors" }]
keywords = ["agents", "on-device-ai", "gateway", "tracing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
foundry = ["foundry-local-sdk>=1.0,<2"]
foundry-winml = ["foundry-local-sdk-winml>=1.0,<2"]

[project.urls]
Homepage = "https://vifu.dev"
Documentation = "https://github.com/vifudotdev/vifu/tree/main/docs/get-started"
Repository = "https://github.com/vifudotdev/vifu"
Issues = "https://github.com/vifudotdev/vifu/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vifu = ["py.typed", "*.dylib", "*.so", "*.dll", "_bin/*", "integrations/*.py"]
