name: Release Vifu binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: vifu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: vifu
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: vifu
            archive: tar
          - os: macos-14
            target: aarch64-apple-darwin
            binary: vifu
            archive: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: vifu.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build runtime
        run: cargo build --release --locked -p vifu --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          asset="vifu-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "dist/$asset/config"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$asset/vifu"
          cp LICENSE "dist/$asset/LICENSE"
          cp README.md "dist/$asset/README.md"
          cp config/runtime.example.json "dist/$asset/config/runtime.example.json"
          tar -C dist -czf "dist/$asset.tar.gz" "$asset"
          (
            cd dist
            shasum -a 256 "$asset.tar.gz" > "$asset.tar.gz.sha256"
          )
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "vifu-$($env:GITHUB_REF_NAME -replace '^v','')-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$asset/config" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$asset/vifu.exe"
          Copy-Item LICENSE "dist/$asset/LICENSE"
          Copy-Item README.md "dist/$asset/README.md"
          Copy-Item config/runtime.example.json "dist/$asset/config/runtime.example.json"
          Compress-Archive -Path "dist/$asset" -DestinationPath "dist/$asset.zip"
          $hash = (Get-FileHash "dist/$asset.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText(
            "dist/$asset.zip.sha256",
            "$hash  ${asset}.zip`n",
            [Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  apple:
    name: Apple Swift package
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: apple-swift-package
      - name: Build XCFramework
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vifu-apple-target
          VIFU_APPLE_DIST_DIR: ${{ runner.temp }}/dist
        run: scripts/build-apple-package.sh
      - name: Verify release URL and checksum
        shell: bash
        run: |
          expected="$(sed -n 's/.*checksum: "\([0-9a-f]*\)".*/\1/p' Package.swift)"
          actual="$(cut -d ' ' -f 1 "$RUNNER_TEMP/dist/VifuMobileFFI.xcframework.zip.sha256")"
          test -n "$expected"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$actual" = "$expected"
            grep -F "/$GITHUB_REF_NAME/VifuMobileFFI.xcframework.zip" Package.swift
          else
            {
              echo "### Apple Swift package"
              echo
              echo "Update Package.swift before tagging:"
              echo
              echo "\`checksum: \"$actual\"\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: apple-swift-package
          path: |
            ${{ runner.temp }}/dist/VifuMobileFFI.xcframework.zip
            ${{ runner.temp }}/dist/VifuMobileFFI.xcframework.zip.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - apple
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz
          dist/*.tar.gz.sha256
          dist/*.zip
          dist/*.zip.sha256
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
