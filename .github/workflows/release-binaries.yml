name: Release Vifu binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish
        required: false
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  VIFUGODOT_RELEASE_REPOSITORY: ${{ vars.VIFUGODOT_RELEASE_REPOSITORY || 'vifudotdev/VifuGodot' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: vifu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: vifu
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: vifu
            archive: tar
          - os: macos-14
            target: aarch64-apple-darwin
            binary: vifu
            archive: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: vifu.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Build embedded Dashboard
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build:console
          test -s target/vifu-console-assets/index.html
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build runtime
        env:
          VIFU_REQUIRE_CONSOLE_ASSETS: "1"
        run: cargo build --release --locked -p vifu --all-features --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          asset="vifu-${RELEASE_TAG#v}-${{ matrix.target }}"
          mkdir -p "dist/$asset/config"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$asset/vifu"
          cp LICENSE "dist/$asset/LICENSE"
          cp README.md "dist/$asset/README.md"
          cp config/runtime.example.toml "dist/$asset/config/runtime.example.toml"
          tar -C dist -czf "dist/$asset.tar.gz" "$asset"
          (
            cd dist
            shasum -a 256 "$asset.tar.gz" > "$asset.tar.gz.sha256"
          )
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "vifu-$($env:RELEASE_TAG -replace '^v','')-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$asset/config" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$asset/vifu.exe"
          Copy-Item LICENSE "dist/$asset/LICENSE"
          Copy-Item README.md "dist/$asset/README.md"
          Copy-Item config/runtime.example.toml "dist/$asset/config/runtime.example.toml"
          Compress-Archive -Path "dist/$asset" -DestinationPath "dist/$asset.zip"
          $hash = (Get-FileHash "dist/$asset.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText(
            "dist/$asset.zip.sha256",
            "$hash  ${asset}.zip`n",
            [Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  apple:
    name: Apple Swift package
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Inspect Swift package release
        id: swift-package
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          build=false
          if [[ -z "$REQUESTED_RELEASE_TAG" ]] && [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            build=true
          elif grep -F "/$RELEASE_TAG/VifuMobileFFI.xcframework.zip" Package.swift; then
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.95.0
        if: steps.swift-package.outputs.build == 'true'
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: steps.swift-package.outputs.build == 'true'
        with:
          shared-key: apple-swift-package
      - name: Build XCFramework
        if: steps.swift-package.outputs.build == 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vifu-apple-target
          VIFU_APPLE_DIST_DIR: ${{ runner.temp }}/dist
        run: scripts/build-apple-package.sh
      - name: Verify release URL and checksum
        if: steps.swift-package.outputs.build == 'true'
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected="$(sed -n 's/.*checksum: "\([0-9a-f]*\)".*/\1/p' Package.swift)"
          actual="$(cut -d ' ' -f 1 "$RUNNER_TEMP/dist/VifuMobileFFI.xcframework.zip.sha256")"
          test -n "$expected"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] || [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
            test "$actual" = "$expected"
            grep -F "/$RELEASE_TAG/VifuMobileFFI.xcframework.zip" Package.swift
          else
            {
              echo "### Apple Swift package"
              echo
              echo "Update Package.swift before tagging:"
              echo
              echo "\`checksum: \"$actual\"\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.swift-package.outputs.build == 'true'
        with:
          name: apple-swift-package
          path: |
            ${{ runner.temp }}/dist/VifuMobileFFI.xcframework.zip
            ${{ runner.temp }}/dist/VifuMobileFFI.xcframework.zip.sha256
          if-no-files-found: error

  android:
    name: Android Maven packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-maven-release
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          test -n "${ANDROID_NDK_LATEST_HOME:-}"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build signed Android Starter APK
        working-directory: examples/android-starter
        env:
          VIFU_ANDROID_STARTER_KEYSTORE_BASE64: ${{ secrets.VIFU_ANDROID_STARTER_KEYSTORE_BASE64 }}
          VIFU_ANDROID_STARTER_KEYSTORE_PASSWORD: ${{ secrets.VIFU_ANDROID_STARTER_KEYSTORE_PASSWORD }}
          VIFU_ANDROID_STARTER_KEY_ALIAS: ${{ secrets.VIFU_ANDROID_STARTER_KEY_ALIAS }}
          VIFU_ANDROID_STARTER_KEY_PASSWORD: ${{ secrets.VIFU_ANDROID_STARTER_KEY_PASSWORD }}
          VIFU_ANDROID_TEMP_DIR: ${{ runner.temp }}
        run: |
          version="${RELEASE_TAG#v}"
          optimized_version_code=$((GITHUB_RUN_NUMBER * 2))
          baseline_version_code=$((optimized_version_code + 1))
          test -n "$version"
          test -n "$VIFU_ANDROID_STARTER_KEYSTORE_BASE64"
          test -n "$VIFU_ANDROID_STARTER_KEYSTORE_PASSWORD"
          test -n "$VIFU_ANDROID_STARTER_KEY_ALIAS"
          test -n "$VIFU_ANDROID_STARTER_KEY_PASSWORD"
          export VIFU_ANDROID_STARTER_KEYSTORE="$RUNNER_TEMP/vifu-android-starter.jks"
          printf '%s' "$VIFU_ANDROID_STARTER_KEYSTORE_BASE64" | base64 --decode > "$VIFU_ANDROID_STARTER_KEYSTORE"
          chmod 600 "$VIFU_ANDROID_STARTER_KEYSTORE"
          ./gradlew assembleRelease \
            -PvifuUseLocalCheckout=true \
            -PvifuVersion="$version" \
            -PstarterVersionName="$version" \
            -PstarterVersionCode="$optimized_version_code"
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/release-assets/vifu-android-starter.apk"
          ./gradlew clean assembleRelease \
            -PvifuUseLocalCheckout=true \
            -PvifuBackend=baseline \
            -PvifuVersion="$version" \
            -PstarterVersionName="$version" \
            -PstarterVersionCode="$baseline_version_code"
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/release-assets/vifu-android-starter-baseline.apk"
          cd "$GITHUB_WORKSPACE/release-assets"
          sha256sum vifu-android-starter*.apk > \
            "vifu-android-starter-checksums.sha256"
      - name: Build, sign, and publish Android packages
        working-directory: integrations/android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          VIFU_ANDROID_TEMP_DIR: ${{ runner.temp }}
        run: |
          version="${RELEASE_TAG#v}"
          test -n "$version"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
          ./gradlew publishToMavenCentral -PVERSION_NAME="$version"
      - uses: actions/upload-artifact@v7
        with:
          name: android-maven-packages
          path: |
            integrations/android/vifu-android-core/build/outputs/aar/*.aar
            integrations/android/vifu-android-llama/build/outputs/aar/*.aar
            integrations/android/vifu-android-llama-baseline/build/outputs/aar/*.aar
            integrations/android/vifu-android-whisper/build/outputs/aar/*.aar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: android-starter-apk
          path: |
            release-assets/*.apk
            release-assets/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs:
      - build
      - apple
      - android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.tar.gz
          dist/*.tar.gz.sha256
          dist/*.zip
          dist/*.zip.sha256
          dist/*.apk
          dist/vifu-android-starter-checksums.sha256
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes

  publish-vifugodot:
    name: Publish VifuGodot source package
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs:
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: publish-vifugodot
      cancel-in-progress: false
    steps:
      - name: Resolve release GitHub App ID
        id: app-config
        env:
          APP_ID_VARIABLE: ${{ vars.VIFU_RELEASE_APP_ID }}
          APP_ID_SECRET: ${{ secrets.VIFU_RELEASE_APP_ID }}
        run: |
          APP_ID="${APP_ID_VARIABLE:-$APP_ID_SECRET}"
          if [ -z "$APP_ID" ]; then
            echo "::error::Missing VIFU_RELEASE_APP_ID repository variable or secret. Use the numeric GitHub App ID, not the Client ID."
            exit 1
          fi
          echo "app-id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve VifuGodot repository
        id: vifugodot-repo
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VIFUGODOT_RELEASE_REPOSITORY" != */* ]]; then
            echo "::error::VIFUGODOT_RELEASE_REPOSITORY must be owner/name, got: $VIFUGODOT_RELEASE_REPOSITORY"
            exit 1
          fi
          echo "owner=${VIFUGODOT_RELEASE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${VIFUGODOT_RELEASE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create VifuGodot release token
        id: vifugodot-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ steps.app-config.outputs.app-id }}
          private-key: ${{ secrets.VIFU_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.vifugodot-repo.outputs.owner }}
          repositories: ${{ steps.vifugodot-repo.outputs.name }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Publish matching VifuGodot package
        env:
          GH_TOKEN: ${{ steps.vifugodot-token.outputs.token }}
        run: scripts/publish-vifugodot.sh "$RELEASE_TAG"
