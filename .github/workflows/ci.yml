name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIFU_TEST_DATABASE_REQUIRED: "1"
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vifu
          POSTGRES_USER: vifu
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vifu -d vifu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Export tracked source for secret scan
        run: |
          mkdir -p "$RUNNER_TEMP/vifu-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/vifu-source"
      - name: Secret scan
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/vifu-source:/repo:ro"
          -w /repo
          zricethezav/gitleaks:v8.18.4
          detect --source=/repo --no-git --redact --no-banner
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: |
          cargo test --workspace --locked --exclude vifu-provider-llama
          cargo test --locked -p vifu-provider-llama
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Vifu application configurations
        run: |
          cargo check --locked -p vifu
          cargo check --locked -p vifu --features local-whisper
      - name: Public repository hygiene
        run: node scripts/check-public-repo.mjs
        env:
          VIFU_PRIVATE_TERMS: ${{ secrets.PUBLIC_REPOSITORY_PRIVATE_TERMS }}
      - name: VifuGodot release tooling
        run: scripts/test-publish-vifugodot.sh

  rust-packages:
    name: Rust package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-artifacts
      - name: Verify publishable crates
        run: |
          cargo package --locked -p vifu-runtime
          cargo package --locked -p vifu-provider-llama \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"'
          cargo package --locked -p vifu-gateway \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"'
          cargo package --locked -p vifu-server \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"' \
            --config 'patch.crates-io.vifu-gateway.path="crates/vifu-gateway"'
          cargo package --locked -p vifu \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"' \
            --config 'patch.crates-io.vifu-gateway.path="crates/vifu-gateway"' \
            --config 'patch.crates-io.vifu-provider-llama.path="crates/vifu-provider-llama"' \
            --config 'patch.crates-io.vifu-server.path="crates/vifu-server"'

  mobile-ffi-apple:
    name: Mobile FFI (Apple)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mobile-ffi-apple
      - name: Build and verify Swift package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vifu-apple-target
          VIFU_APPLE_DIST_DIR: ${{ runner.temp }}/dist
        run: |
          scripts/build-apple-package.sh
          mkdir -p target/vifu-apple-ci
          cp -R \
            "$RUNNER_TEMP/dist/VifuMobileFFI.xcframework" \
            target/vifu-apple-ci/VifuMobileFFI.xcframework
          VIFU_SWIFT_LOCAL_ARTIFACT=target/vifu-apple-ci/VifuMobileFFI.xcframework \
            swift test
          VIFU_SWIFT_LOCAL_ARTIFACT=target/vifu-apple-ci/VifuMobileFFI.xcframework \
            xcodebuild \
              -scheme Vifu \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$RUNNER_TEMP/vifu-swift-ios-derived" \
              CODE_SIGNING_ALLOWED=NO \
              build
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-ffi-apple-framework
          path: target/vifu-apple-ci/VifuMobileFFI.xcframework
          if-no-files-found: error

  godot-bridge-apple:
    name: Godot bridge (Apple)
    needs: mobile-ffi-apple
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: vifu-godot-workspace/vifu
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: vifudotdev/SwiftGodot
          ref: 0ed15c08b71bd8ad0eae611f2c64d10c63f104df
          path: vifu-godot-workspace/libgodot/SwiftGodot
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: vifudotdev/SwiftGodotKit
          ref: 6633cb9044400291ec56ad67552dddb34a3870e5
          path: vifu-godot-workspace/libgodot/SwiftGodotKit
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: mobile-ffi-apple-framework
          path: vifu-godot-workspace/vifu/target/vifu-apple-ci
      - name: Test VifuGodot package
        working-directory: vifu-godot-workspace/vifu
        env:
          VIFU_GODOT_VIFU_PATH: ${{ github.workspace }}/vifu-godot-workspace/vifu
          VIFU_GODOT_SWIFTGODOTKIT_PATH: ${{ github.workspace }}/vifu-godot-workspace/libgodot/SwiftGodotKit
          VIFU_GODOT_SWIFTGODOT_PATH: ${{ github.workspace }}/vifu-godot-workspace/libgodot/SwiftGodot
          SWIFTGODOTKIT_SWIFTGODOT_PATH: ${{ github.workspace }}/vifu-godot-workspace/libgodot/SwiftGodot
          VIFU_SWIFT_LOCAL_ARTIFACT: target/vifu-apple-ci/VifuMobileFFI.xcframework
        run: swift test --package-path integrations/godot/apple

  mobile-ffi-android:
    name: Mobile FFI (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mobile-ffi-android
      - name: Detect Android NDK
        id: android-ndk
        run: |
          case "$(uname -s)" in
            Darwin) ndk_host="darwin-x86_64" ;;
            Linux) ndk_host="linux-x86_64" ;;
            *) ndk_host="" ;;
          esac
          ndk_bin="${ANDROID_NDK_LATEST_HOME:-}/toolchains/llvm/prebuilt/$ndk_host/bin"
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] \
            && [ -n "$ndk_host" ] \
            && [ -x "$ndk_bin/aarch64-linux-android24-clang" ] \
            && [ -x "$ndk_bin/aarch64-linux-android24-clang++" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ndk_bin=$ndk_bin" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android NDK was not found on this runner; skipping Android FFI artifact build."
          fi
      - name: Configure Android linker
        if: steps.android-ndk.outputs.available == 'true'
        run: |
          ndk_bin="${{ steps.android-ndk.outputs.ndk_bin }}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ndk_bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$ndk_bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk_bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Build Android library
        if: steps.android-ndk.outputs.available == 'true'
        run: |
          cargo build --locked -p vifu-mobile-ffi
          cargo build --locked -p vifu-mobile-ffi --bin uniffi-bindgen
          cargo build --locked -p vifu-mobile-ffi --release --target aarch64-linux-android
      - name: Generate Kotlin bindings
        if: steps.android-ndk.outputs.available == 'true'
        run: |
          bindings="$RUNNER_TEMP/vifu-mobile-bindings"
          target/debug/uniffi-bindgen generate \
            --library target/debug/libvifu_mobile_ffi.so \
            --language kotlin \
            --out-dir "$bindings" \
            --config crates/vifu-mobile-ffi/uniffi.toml
          test -f "$bindings/dev/vifu/runtime/vifu_mobile_ffi.kt"
      - name: Skip Android library
        if: steps.android-ndk.outputs.available != 'true'
        run: echo "Android FFI build skipped because this runner does not provide Android NDK."

  dashboard:
    name: Dashboard and JavaScript packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install
        run: bun install --frozen-lockfile
      - name: Repository checks
        run: bun run check
        env:
          VIFU_PRIVATE_TERMS: ${{ secrets.PUBLIC_REPOSITORY_PRIVATE_TERMS }}
      - name: Unit tests
        run: bun run test
      - name: Production builds
        run: |
          bun run build
          bun run build:console
          test -s target/vifu-console-assets/index.html
      - name: Install focused browser
        run: bunx playwright install --with-deps chromium
      - name: Focused runtime console browser contract
        run: bunx playwright test --config playwright.console.config.ts
      - name: Inspect public package artifacts
        run: npm pack --dry-run --json ./packages/protocol

  self-hosted-docker:
    name: Clean self-hosted Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dashboard test dependencies
        run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      - name: Build cached runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: vifu-runtime:local
          cache-from: type=gha,scope=self-hosted-runtime
          cache-to: type=gha,mode=max,scope=self-hosted-runtime
      - name: Build cached dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: npm-packages/dashboard/Dockerfile
          load: true
          tags: vifu-dashboard:local
          cache-from: type=gha,scope=self-hosted-dashboard
          cache-to: type=gha,mode=max,scope=self-hosted-dashboard
      - name: Initialize self-hosted environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Agent Gateway, concurrency, restart, persistence, and browser E2E
        run: sh scripts/run-self-hosted-e2e.sh
        env:
          VIFU_E2E_PREBUILT_IMAGES: "1"
          VIFU_E2E_RUNTIME_IMAGE: vifu-runtime:local
      - name: Upload self-hosted browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: self-hosted-browser-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
