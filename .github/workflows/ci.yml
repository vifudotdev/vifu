name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIFU_TEST_DATABASE_REQUIRED: "1"
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vifu
          POSTGRES_USER: vifu
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vifu -d vifu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Export tracked source for secret scan
        run: |
          mkdir -p "$RUNNER_TEMP/vifu-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/vifu-source"
      - name: Secret scan
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/vifu-source:/repo:ro"
          -w /repo
          zricethezav/gitleaks:v8.18.4
          detect --source=/repo --no-git --redact --no-banner
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Vifu application configurations
        run: |
          cargo check --locked -p vifu
          cargo check --locked -p vifu --features local-whisper
      - name: Public repository hygiene
        run: node scripts/check-public-repo.mjs
        env:
          VIFU_PRIVATE_TERMS: ${{ secrets.PUBLIC_REPOSITORY_PRIVATE_TERMS }}

  rust-packages:
    name: Rust package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-artifacts
      - name: Verify publishable crates
        run: |
          cargo package --locked -p vifu-runtime
          cargo package --locked -p vifu-gateway \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"'
          cargo package --locked -p vifu-server \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"' \
            --config 'patch.crates-io.vifu-gateway.path="crates/vifu-gateway"'
          cargo package --locked -p vifu \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"' \
            --config 'patch.crates-io.vifu-gateway.path="crates/vifu-gateway"' \
            --config 'patch.crates-io.vifu-server.path="crates/vifu-server"'

  mobile-ffi-apple:
    name: Mobile FFI (Apple)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mobile-ffi-apple
      - name: Build and verify Swift package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vifu-apple-target
          VIFU_APPLE_DIST_DIR: ${{ runner.temp }}/dist
        run: |
          scripts/build-apple-package.sh
          mkdir -p target/vifu-apple-ci
          cp -R \
            "$RUNNER_TEMP/dist/VifuMobileFFI.xcframework" \
            target/vifu-apple-ci/VifuMobileFFI.xcframework
          VIFU_SWIFT_LOCAL_ARTIFACT=target/vifu-apple-ci/VifuMobileFFI.xcframework \
            swift test
          VIFU_SWIFT_LOCAL_ARTIFACT=target/vifu-apple-ci/VifuMobileFFI.xcframework \
            xcodebuild \
              -scheme Vifu \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$RUNNER_TEMP/vifu-swift-ios-derived" \
              CODE_SIGNING_ALLOWED=NO \
              build

  mobile-ffi-android:
    name: Mobile FFI (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mobile-ffi-android
      - name: Configure Android linker
        run: |
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Build Android library
        run: |
          cargo build --locked -p vifu-mobile-ffi
          cargo build --locked -p vifu-mobile-ffi --bin uniffi-bindgen
          cargo build --locked -p vifu-mobile-ffi --release --target aarch64-linux-android
      - name: Generate Kotlin bindings
        run: |
          bindings="$RUNNER_TEMP/vifu-mobile-bindings"
          target/debug/uniffi-bindgen generate \
            --library target/debug/libvifu_mobile_ffi.so \
            --language kotlin \
            --out-dir "$bindings" \
            --config crates/vifu-mobile-ffi/uniffi.toml
          test -f "$bindings/dev/vifu/runtime/vifu_mobile_ffi.kt"

  dashboard:
    name: Dashboard and JavaScript packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install
        run: bun install --frozen-lockfile
      - name: Repository checks
        run: bun run check
        env:
          VIFU_PRIVATE_TERMS: ${{ secrets.PUBLIC_REPOSITORY_PRIVATE_TERMS }}
      - name: Unit tests
        run: bun run test
      - name: Production builds
        run: bun run build
      - name: Inspect public package artifacts
        run: |
          npm pack --dry-run --json ./packages/protocol
          npm pack --dry-run --json ./packages/runtime
          npm pack --dry-run --json ./packages/sdk

  self-hosted-docker:
    name: Clean self-hosted Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dashboard test dependencies
        run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Initialize self-hosted environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Agent Gateway, concurrency, restart, persistence, and browser E2E
        run: sh scripts/run-self-hosted-e2e.sh
