name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  mobile-changes:
    name: Mobile change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apple: ${{ steps.scope.outputs.apple }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect mobile changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          head="$GITHUB_SHA"
          if [[ -z "$base" ]] \
            || [[ "$base" =~ ^0+$ ]] \
            || ! git cat-file -e "$base^{commit}"; then
            base="$(git rev-list --max-parents=0 "$head" | tail -1)"
          fi

          apple=false
          android=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              Cargo.toml|Cargo.lock|rust-toolchain|rust-toolchain.toml|.cargo/*|crates/vifu-mobile-ffi/*|crates/vifu-runtime/*|crates/vifu-gateway/*|crates/vifu-provider-llama/*)
                apple=true
                android=true
                ;;
              Package.swift|apple/*|examples/ios-starter/*|examples/godot-ios-starter/*|integrations/godot/apple/*|scripts/build-apple-package.sh)
                apple=true
                ;;
              crates/vifu-llama-ffi/*|crates/vifu-whisper-ffi/*|examples/android-starter/*|integrations/android/*|scripts/build-android-package.sh|scripts/cmake/*)
                android=true
                ;;
              .github/workflows/ci.yml|.github/workflows/release-binaries.yml)
                apple=true
                android=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          echo "apple=$apple" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIFU_TEST_DATABASE_REQUIRED: "1"
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vifu
          POSTGRES_USER: vifu
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vifu -d vifu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Export tracked source for secret scan
        run: |
          mkdir -p "$RUNNER_TEMP/vifu-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/vifu-source"
      - name: Secret scan
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/vifu-source:/repo:ro"
          -w /repo
          zricethezav/gitleaks:v8.18.4
          detect --source=/repo --no-git --redact --no-banner
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: |
          cargo test --workspace --locked --exclude vifu-provider-llama
          cargo test --locked -p vifu-provider-llama
      - name: Topology protocol live matrix
        env:
          VIFU_TOPOLOGY_REPORT_DIR: ${{ runner.temp }}/vifu-topology-live
        run: scripts/test-topologies.sh
      - name: Upload topology live-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: topology-live-test-report
          path: ${{ runner.temp }}/vifu-topology-live
          if-no-files-found: error
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Vifu application configurations
        run: |
          cargo check --locked -p vifu
          cargo check --locked -p vifu --features local-whisper
      - name: Public repository hygiene
        run: node scripts/check-public-repo.mjs
        env:
          VIFU_PRIVATE_TERMS: ${{ secrets.PUBLIC_REPOSITORY_PRIVATE_TERMS }}
      - name: VifuGodot release tooling
        run: scripts/test-publish-vifugodot.sh

  rust-packages:
    name: Rust package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-artifacts
      - name: Verify publishable crates
        run: |
          cargo package --locked -p vifu-runtime
          cargo package --locked -p vifu-provider-llama \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"'
          cargo package --locked -p vifu-gateway \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"'
          cargo package --locked -p vifu-server \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"' \
            --config 'patch.crates-io.vifu-gateway.path="crates/vifu-gateway"'
          cargo package --locked -p vifu \
            --config 'patch.crates-io.vifu-runtime.path="crates/vifu-runtime"' \
            --config 'patch.crates-io.vifu-gateway.path="crates/vifu-gateway"' \
            --config 'patch.crates-io.vifu-provider-llama.path="crates/vifu-provider-llama"' \
            --config 'patch.crates-io.vifu-server.path="crates/vifu-server"'

  mobile-ffi-apple:
    name: Mobile FFI (Apple)
    needs:
      - mobile-changes
      - rust
      - rust-packages
      - dashboard
      - self-hosted-docker
    if: needs.mobile-changes.outputs.apple == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mobile-ffi-apple
          workspaces: . -> target/vifu-apple-ci-build
      - name: Build and verify Swift package
        env:
          CARGO_TARGET_DIR: target/vifu-apple-ci-build
          VIFU_APPLE_DIST_DIR: ${{ runner.temp }}/dist
        run: |
          scripts/build-apple-package.sh --ci
          mkdir -p target/vifu-apple-ci
          cp -R \
            "$RUNNER_TEMP/dist/VifuMobileFFI.xcframework" \
            target/vifu-apple-ci/VifuMobileFFI.xcframework
          VIFU_SWIFT_LOCAL_ARTIFACT=target/vifu-apple-ci/VifuMobileFFI.xcframework \
            swift test
          VIFU_SWIFT_LOCAL_ARTIFACT=target/vifu-apple-ci/VifuMobileFFI.xcframework \
            xcodebuild \
              -scheme Vifu \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$RUNNER_TEMP/vifu-swift-ios-derived" \
              CODE_SIGNING_ALLOWED=NO \
              build
          VIFU_SWIFT_LOCAL_ARTIFACT=target/vifu-apple-ci/VifuMobileFFI.xcframework \
            xcodebuild \
              -project examples/ios-starter/VifuIOSStarter.xcodeproj \
              -scheme VifuIOSStarter \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$RUNNER_TEMP/vifu-ios-starter-derived" \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=YES \
              build
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-ffi-apple-framework
          path: target/vifu-apple-ci/VifuMobileFFI.xcframework
          if-no-files-found: error

  godot-bridge-apple:
    name: Godot bridge (Apple)
    needs: mobile-ffi-apple
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: vifu-godot-workspace/vifu
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: vifudotdev/SwiftGodot
          ref: 0ed15c08b71bd8ad0eae611f2c64d10c63f104df
          path: vifu-godot-workspace/libgodot/SwiftGodot
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: vifudotdev/SwiftGodotKit
          ref: 6633cb9044400291ec56ad67552dddb34a3870e5
          path: vifu-godot-workspace/libgodot/SwiftGodotKit
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: mobile-ffi-apple-framework
          path: vifu-godot-workspace/vifu/target/vifu-apple-ci/VifuMobileFFI.xcframework
      - name: Test VifuGodot package and Starter
        working-directory: vifu-godot-workspace/vifu
        env:
          VIFU_GODOT_VIFU_PATH: ${{ github.workspace }}/vifu-godot-workspace/vifu
          VIFU_GODOT_SWIFTGODOTKIT_PATH: ${{ github.workspace }}/vifu-godot-workspace/libgodot/SwiftGodotKit
          VIFU_GODOT_SWIFTGODOT_PATH: ${{ github.workspace }}/vifu-godot-workspace/libgodot/SwiftGodot
          SWIFTGODOTKIT_SWIFTGODOT_PATH: ${{ github.workspace }}/vifu-godot-workspace/libgodot/SwiftGodot
          VIFU_SWIFT_LOCAL_ARTIFACT: target/vifu-apple-ci/VifuMobileFFI.xcframework
        run: |
          swift test --package-path integrations/godot/apple
          xcodebuild \
            -project examples/godot-ios-starter/VifuGodotIOSStarter.xcodeproj \
            -scheme VifuGodotIOSStarter \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/vifu-godot-ios-starter-derived" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build

  mobile-ffi-android:
    name: Mobile FFI (Android)
    needs:
      - mobile-changes
      - rust
      - rust-packages
      - dashboard
      - self-hosted-docker
    if: needs.mobile-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mobile-ffi-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          test -n "${ANDROID_NDK_LATEST_HOME:-}"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build and inspect Android Maven artifacts
        working-directory: integrations/android
        env:
          VIFU_ANDROID_TEMP_DIR: ${{ runner.temp }}
        run: |
          ./gradlew :vifu-android-core:testDebugUnitTest
          ./gradlew publishToMavenLocal \
            -PVERSION_NAME=0.1.12-CI
          core_aar="$HOME/.m2/repository/dev/vifu/vifu-android-core/0.1.12-CI/vifu-android-core-0.1.12-CI.aar"
          optimized_aar="$HOME/.m2/repository/dev/vifu/vifu-android-llama/0.1.12-CI/vifu-android-llama-0.1.12-CI.aar"
          baseline_aar="$HOME/.m2/repository/dev/vifu/vifu-android-llama-baseline/0.1.12-CI/vifu-android-llama-baseline-0.1.12-CI.aar"
          whisper_aar="$HOME/.m2/repository/dev/vifu/vifu-android-whisper/0.1.12-CI/vifu-android-whisper-0.1.12-CI.aar"
          test -s "$core_aar"
          unzip -l "$core_aar" | grep -F "jni/arm64-v8a/libvifu_mobile_ffi.so"
          unzip -l "$core_aar" | grep -F "jni/arm64-v8a/libc++_shared.so"
          test -s "$baseline_aar"
          test -s "$optimized_aar"
          unzip -l "$optimized_aar" | grep -F "jni/arm64-v8a/libvifu_llama_ffi.so"
          unzip -l "$optimized_aar" | grep -F "jni/arm64-v8a/libggml-cpu-"
          unzip -l "$baseline_aar" | grep -F "jni/arm64-v8a/libvifu_llama_ffi.so"
          if unzip -l "$baseline_aar" | grep -F "jni/arm64-v8a/libggml-cpu-"; then
            echo "baseline AAR unexpectedly contains dynamic CPU backends" >&2
            exit 1
          fi
          test -s "$whisper_aar"
          unzip -l "$whisper_aar" | grep -F "jni/arm64-v8a/libvifu_whisper_ffi.so"
      - name: Build Android starter with all local modules
        working-directory: examples/android-starter
        run: |
          ./gradlew testDebugUnitTest assembleDebug \
            -PvifuUseMavenLocal=true \
            -PvifuVersion=0.1.12-CI \
            -PvifuWhisper=true

  dashboard:
    name: Dashboard and JavaScript packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install
        run: bun install --frozen-lockfile
      - name: Repository checks
        run: bun run check
        env:
          VIFU_PRIVATE_TERMS: ${{ secrets.PUBLIC_REPOSITORY_PRIVATE_TERMS }}
      - name: Unit tests
        run: bun run test
      - name: Production builds
        run: |
          bun run build
          bun run build:console
          test -s target/vifu-console-assets/index.html
      - name: Focused runtime console browser contract
        run: bunx playwright test --config playwright.console.config.ts
        env:
          VIFU_PLAYWRIGHT_CHANNEL: chrome
      - name: Inspect public package artifacts
        run: npm pack --dry-run --json ./packages/protocol

  self-hosted-docker:
    name: Clean self-hosted Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dashboard test dependencies
        run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build cached runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: vifu-runtime:local
          cache-from: type=gha,scope=self-hosted-runtime
          cache-to: type=gha,mode=max,scope=self-hosted-runtime
      - name: Build cached dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: npm-packages/dashboard/Dockerfile
          load: true
          tags: vifu-dashboard:local
          cache-from: type=gha,scope=self-hosted-dashboard
          cache-to: type=gha,mode=max,scope=self-hosted-dashboard
      - name: Initialize self-hosted environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Agent Gateway, concurrency, restart, persistence, and browser E2E
        run: sh scripts/run-self-hosted-e2e.sh
        env:
          VIFU_E2E_PREBUILT_IMAGES: "1"
          VIFU_E2E_RUNTIME_IMAGE: vifu-runtime:local
          VIFU_PLAYWRIGHT_CHANNEL: chrome
      - name: Upload self-hosted browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: self-hosted-browser-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
