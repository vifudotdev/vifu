name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      VIFU_TEST_DATABASE_REQUIRED: "1"
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vifu
          POSTGRES_USER: vifu
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vifu -d vifu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Secret scan
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo
          zricethezav/gitleaks:v8.18.4
          detect --source=/repo --no-git --redact --no-banner
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build
      - name: Inspect public crate contents
        run: |
          cargo package -p vifu --allow-dirty --no-verify --list
          cargo package -p vifu-server --allow-dirty --no-verify --list
      - name: Check
        run: cargo check
      - name: Public repository hygiene
        run: node scripts/check-public-repo.mjs
        env:
          VIFU_PRIVATE_TERMS: ${{ secrets.PUBLIC_REPOSITORY_PRIVATE_TERMS }}

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install
        run: bun install --frozen-lockfile
      - name: Repository checks
        run: bun run check
        env:
          VIFU_PRIVATE_TERMS: ${{ secrets.PUBLIC_REPOSITORY_PRIVATE_TERMS }}
      - name: Standalone dashboard builds
        run: bun run build

  self-hosted-docker:
    name: Clean self-hosted Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dashboard test dependencies
        run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Initialize self-hosted environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Agent Gateway, concurrency, restart, persistence, and browser E2E
        run: sh scripts/run-self-hosted-e2e.sh
