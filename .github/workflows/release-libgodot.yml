name: Release Vifu libgodot binaries

on:
  workflow_dispatch:
    inputs:
      libgodot_ref:
        description: Exact vifudotdev/libgodot commit used by the local build
        required: true
        default: 235560cb32a5265092f7a35c7b376526cbe12cc5
        type: string
      release_tag:
        description: Existing draft tag (for example libgodot-4.5.1-vifu.1)
        required: true
        default: libgodot-4.5.1-vifu.1
        type: string
      publish:
        description: Publish the draft after every verification passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify Apple libgodot draft
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate inputs and draft state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIBGODOT_REF: ${{ inputs.libgodot_ref }}
          LIBGODOT_RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          [[ "$LIBGODOT_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LIBGODOT_RELEASE_TAG" =~ ^libgodot-[0-9]+\.[0-9]+\.[0-9]+-vifu\.[0-9]+$ ]]

          is_draft="$(gh release view "$LIBGODOT_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)"
          if [ "$PUBLISH_RELEASE" = "true" ] && [ "$is_draft" != "true" ]; then
            echo "Publishing requires an existing draft release: $LIBGODOT_RELEASE_TAG" >&2
            exit 1
          fi

          expected_assets="$(printf '%s\n' \
            Godot-COPYRIGHT.txt \
            Godot-LICENSE.txt \
            ios_libgodot.xcframework.zip \
            ios_libgodot.xcframework.zip.sha256 \
            libgodot-source.json \
            mac_libgodot.xcframework.zip \
            mac_libgodot.xcframework.zip.sha256)"
          actual_assets="$(gh release view "$LIBGODOT_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
            | LC_ALL=C sort)"
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "Draft release assets do not match the required set." >&2
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          LIBGODOT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir dist
          gh release download "$LIBGODOT_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist
      - name: Verify source commits exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIBGODOT_REF: ${{ inputs.libgodot_ref }}
        run: |
          godot_ref="$(plutil -extract godot.commit raw -o - dist/libgodot-source.json)"
          gh api "repos/vifudotdev/libgodot/git/commits/$LIBGODOT_REF" >/dev/null
          gh api "repos/vifudotdev/godot/git/commits/$godot_ref" >/dev/null
      - name: Verify checksums and XCFrameworks
        env:
          LIBGODOT_REF: ${{ inputs.libgodot_ref }}
          LIBGODOT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          scripts/verify-libgodot-apple-release.sh \
            dist \
            "$LIBGODOT_RELEASE_TAG" \
            "$LIBGODOT_REF"
      - name: Record verified sources and checksums
        shell: bash
        env:
          LIBGODOT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          {
            echo "### Verified Vifu libgodot release"
            echo
            echo "- Release tag: \`$LIBGODOT_RELEASE_TAG\`"
            echo "- libgodot commit: \`$(plutil -extract libgodot.commit raw -o - dist/libgodot-source.json)\`"
            echo "- Godot commit: \`$(plutil -extract godot.commit raw -o - dist/libgodot-source.json)\`"
            echo
            echo '```text'
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified draft
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          LIBGODOT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release edit "$LIBGODOT_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest=false
