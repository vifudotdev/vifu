name: Release Vifu Python package

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Match the tag to the package
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' sdk/python/pyproject.toml | head -1)"
          test "python-v$package_version" = "${GITHUB_REF_NAME}"

  desktop-wheels:
    name: ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS-arm64
          - os: macos-15-intel
            platform: macOS-x86_64
          - os: windows-2022
            platform: Windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.platform }}
      - name: Build and install the wheel
        shell: bash
        run: |
          scripts/build-python-wheel.sh
          python -m venv "$RUNNER_TEMP/vifu-python-test"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_test="$RUNNER_TEMP/vifu-python-test/Scripts/python.exe"
          else
            python_test="$RUNNER_TEMP/vifu-python-test/bin/python"
          fi
          wheel="$(find target/python-wheel -maxdepth 1 -name 'vifu-*.whl' -print -quit)"
          "$python_test" -m pip install --no-index "$wheel"
          VIFU_EXAMPLE_DATA_DIR="$RUNNER_TEMP/vifu-python-state" \
            "$python_test" examples/python-starter/main.py --once
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.platform }}
          path: target/python-wheel/*.whl
          if-no-files-found: error

  linux-wheels:
    name: ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux-x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64:latest
            tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            platform: Linux-aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64:latest
            tag: manylinux_2_28_aarch64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.platform }}
      - name: Build and install the wheel
        shell: bash
        env:
          PYTHON_BIN: /opt/python/cp311-cp311/bin/python
          VIFU_PYTHON_WHEEL_PLATFORM: ${{ matrix.tag }}
        run: |
          scripts/build-python-wheel.sh
          "$PYTHON_BIN" -m venv "$RUNNER_TEMP/vifu-python-test"
          python_test="$RUNNER_TEMP/vifu-python-test/bin/python"
          wheel="$(find target/python-wheel -maxdepth 1 -name 'vifu-*.whl' -print -quit)"
          auditwheel show "$wheel"
          "$python_test" -m pip install --no-index "$wheel"
          VIFU_EXAMPLE_DATA_DIR="$RUNNER_TEMP/vifu-python-state" \
            "$python_test" examples/python-starter/main.py --once
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.platform }}
          path: target/python-wheel/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs:
      - desktop-wheels
      - linux-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
