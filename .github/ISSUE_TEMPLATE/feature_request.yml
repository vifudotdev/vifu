name: Feature request
description: Suggest a focused Vifu CLI improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Proposed shape
      description: Keep the CLI surface as simple as possible.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: What local data or network boundary changes?
    validations:
      required: true
