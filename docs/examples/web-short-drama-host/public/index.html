<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08090c">
    <title>Last Train to the Moon</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="game-shell" data-state="loading">
      <div class="backdrop" aria-hidden="true">
        <img id="backdrop-image" alt="">
        <span></span>
      </div>

      <header class="game-header">
        <div class="title-lockup">
          <span>月行き最終列車</span>
          <strong>Last Train to the Moon</strong>
        </div>
        <div class="header-actions">
          <label class="locale-control">
            <span class="sr-only">Language</span>
            <select id="locale-select" aria-label="Language">
              <option value="en">EN</option>
              <option value="ja">日本語</option>
              <option value="zh-CN">简体中文</option>
            </select>
          </label>
          <button class="icon-button" id="sound-button" type="button" aria-label="Mute sound" title="Mute sound">
            <span aria-hidden="true">♪</span>
          </button>
          <button class="icon-button" id="restart-button" type="button" aria-label="Restart story" title="Restart story">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </header>

      <section class="story-stage" aria-live="polite">
        <div class="portrait-frame">
          <img class="scene-background" id="scene-background" alt="">
          <div class="character-layer" id="character-layer" aria-hidden="true"></div>
          <div class="story-hud">
            <span id="chapter-label">MIDNIGHT EXPRESS · 00:13</span>
            <span id="connection-status">Connecting</span>
          </div>
          <div class="story-copy" id="story-copy">
            <span class="speaker" id="speaker">VIFU ORIGINAL</span>
            <h1 id="story-title">The last train is waiting.</h1>
            <p id="story-text">A wedding. A dead lover. Thirteen minutes before midnight.</p>
          </div>
          <div class="interaction-layer" id="interaction-layer"></div>
          <div class="loading-screen" id="loading-screen">
            <span class="moon-mark" aria-hidden="true"></span>
            <strong>Opening the lunar line</strong>
            <small>Connecting to the published Vifu runtime</small>
          </div>
        </div>
      </section>

      <footer class="game-footer">
        <span id="release-label">Published runtime</span>
        <span id="session-label">Ready to begin</span>
      </footer>
    </main>

    <template id="start-template">
      <div class="start-panel">
        <span>INTERACTIVE ANIME DRAMA</span>
        <button class="start-button" type="button">Board the last train</button>
        <small>Your choices shape trust, identity, and the final dawn.</small>
      </div>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
