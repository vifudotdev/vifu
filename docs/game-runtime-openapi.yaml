openapi: 3.1.0
info:
  title: Vifu Game Runtime API
  version: 1.0.0
  description: Engine-neutral API for published Vifu Game releases and durable sessions.
servers:
  - url: http://localhost:6790/{projectSlug}/v1/game
    variables:
      projectSlug:
        default: my-game
security:
  - bearerAuth: []
paths:
  /:
    get:
      operationId: getActiveGame
      summary: Get active Game release metadata
      responses:
        "200":
          description: Active release
          content:
            application/json:
              schema:
                type: object
                required: [game]
                properties:
                  game:
                    $ref: "#/components/schemas/ActiveGame"
        default:
          $ref: "#/components/responses/Error"
  /manifest:
    get:
      operationId: getGameManifest
      summary: Get the active release's public manifest
      responses:
        "200":
          description: Public manifest and content identity
          content:
            application/json:
              schema:
                type: object
                required: [releaseId, contentHash, manifest]
                properties:
                  releaseId:
                    type: string
                    format: uuid
                  contentHash:
                    type: string
                  manifest:
                    $ref: "#/components/schemas/GameManifest"
        default:
          $ref: "#/components/responses/Error"
  /presentation:
    get:
      operationId: getGamePresentation
      summary: Get the optional active managed presentation binding
      responses:
        "200":
          description: Host binding manifest
          content:
            application/json:
              schema:
                type: object
                required: [presentation]
                properties:
                  presentation:
                    $ref: "#/components/schemas/HostBindingManifest"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /assets/{assetVersionId}:
    get:
      operationId: getGameAssetVersion
      summary: Read an immutable managed asset version
      parameters:
        - in: path
          name: assetVersionId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Range
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          description: Complete asset
          headers:
            Accept-Ranges:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    post:
      operationId: createGameSession
      summary: Create a durable session pinned to the active release
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [session, optionalCapabilityFallbacks]
                properties:
                  session:
                    $ref: "#/components/schemas/PublicSession"
                  optionalCapabilityFallbacks:
                    type: array
                    items:
                      type: string
        default:
          $ref: "#/components/responses/Error"
  /sessions/{sessionId}:
    get:
      operationId: getGameSession
      summary: Get public durable session state
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Public session state
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/PublicSession"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{sessionId}/commands:
    post:
      operationId: submitGameCommand
      summary: Idempotently advance a durable session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameCommand"
      responses:
        "200":
          description: Public events and stable runtime boundary
          content:
            application/json:
              schema:
                type: object
                required: [advance]
                properties:
                  advance:
                    $ref: "#/components/schemas/PublicAdvance"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{sessionId}/events:
    get:
      operationId: streamGameEvents
      summary: Stream and replay committed CloudEvents
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: SSE stream whose data fields contain GameEvent JSON
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /run:
    post:
      operationId: runGame
      summary: Create a durable session and submit game.start
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunGameRequest"
      responses:
        "201":
          description: Session and first stable runtime boundary
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, releaseId, advance, optionalCapabilityFallbacks]
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  releaseId:
                    type: string
                    format: uuid
                  advance:
                    $ref: "#/components/schemas/PublicAdvance"
                  optionalCapabilityFallbacks:
                    type: array
                    items:
                      type: string
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Project API key with Game Runtime Execute permission.
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: JSON error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ActiveGame:
      type: object
      required:
        - projectSlug
        - releaseId
        - releaseNumber
        - contentHash
        - createdAt
        - compatibility
        - inputs
        - outputs
        - requiredHostCapabilities
        - optionalHostCapabilities
      properties:
        projectSlug:
          type: string
        releaseId:
          type: string
          format: uuid
        releaseNumber:
          type: integer
          minimum: 1
        contentHash:
          type: string
        createdAt:
          type: string
          format: date-time
        compatibility:
          type: object
          additionalProperties: true
        inputs:
          type: object
          additionalProperties: true
        outputs:
          type: object
          additionalProperties: true
        requiredHostCapabilities:
          type: array
          items:
            type: string
        optionalHostCapabilities:
          type: array
          items:
            type: string
    GameManifest:
      type: object
      required:
        - schemaVersion
        - name
        - commands
        - events
        - inputs
        - outputs
        - scenes
        - characters
        - logicalResources
        - requiredHostCapabilities
        - optionalHostCapabilities
        - locales
        - compatibility
      properties:
        schemaVersion:
          type: integer
          const: 1
        name:
          type: string
        description:
          type: string
        commands:
          type: object
          additionalProperties:
            type: object
        events:
          type: object
          additionalProperties:
            type: object
        inputs:
          type: object
        outputs:
          type: object
        scenes:
          type: array
          items:
            $ref: "#/components/schemas/ManifestItem"
        characters:
          type: array
          items:
            $ref: "#/components/schemas/ManifestItem"
        logicalResources:
          type: array
          items:
            $ref: "#/components/schemas/LogicalResource"
        requiredHostCapabilities:
          type: array
          items:
            type: string
        optionalHostCapabilities:
          type: array
          items:
            type: string
        locales:
          type: array
          items:
            type: string
        compatibility:
          type: object
          required: [protocol, minimumVersion]
          properties:
            protocol:
              type: string
            minimumVersion:
              type: integer
    ManifestItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    LogicalResource:
      type: object
      required: [id, kind, requiredCapabilities, required]
      properties:
        id:
          type: string
        kind:
          type: string
        requiredCapabilities:
          type: array
          items:
            type: string
        required:
          type: boolean
        fallback: {}
    HostBindingManifest:
      type: object
      required: [schemaVersion, engine, bindings]
      properties:
        schemaVersion:
          type: integer
          const: 1
        engine:
          type: string
        adapterVersion:
          type: string
        bindings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HostBinding"
    HostBinding:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
        value: {}
    HostDescriptor:
      type: object
      required: [engine, capabilities]
      additionalProperties: false
      properties:
        engine:
          type: string
          minLength: 1
        adapterVersion:
          type: string
        capabilities:
          type: array
          items:
            type: string
        locale:
          type: string
        bindingManifestHash:
          type: string
    CreateSessionRequest:
      type: object
      required: [host]
      additionalProperties: false
      properties:
        host:
          $ref: "#/components/schemas/HostDescriptor"
        randomSeed:
          type: integer
          minimum: 0
    RunGameRequest:
      type: object
      required: [host]
      additionalProperties: false
      properties:
        host:
          $ref: "#/components/schemas/HostDescriptor"
        input: {}
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
    GameCommand:
      type: object
      required: [idempotencyKey, type]
      additionalProperties: false
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
        expectedRevision:
          type: integer
          minimum: 0
        type:
          type: string
          enum:
            - game.start
            - player.choice
            - player.text
            - player.action
            - host.ready
            - host.signal
            - host.action.completed
            - host.action.failed
            - game.cancel
        data: {}
    PublicSession:
      type: object
      required:
        - id
        - gameReleaseId
        - status
        - revision
        - outstandingHostActions
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        gameReleaseId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SessionStatus"
        revision:
          type: integer
          minimum: 0
        publicOutput: {}
        outstandingHostActions:
          type: array
          items:
            $ref: "#/components/schemas/PendingHostAction"
        failure:
          $ref: "#/components/schemas/RuntimeFailure"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    PublicAdvance:
      type: object
      required: [status, revision, outstandingHostActions, events]
      properties:
        status:
          $ref: "#/components/schemas/SessionStatus"
        revision:
          type: integer
          minimum: 0
        publicOutput: {}
        outstandingHostActions:
          type: array
          items:
            $ref: "#/components/schemas/PendingHostAction"
        failure:
          $ref: "#/components/schemas/RuntimeFailure"
        events:
          type: array
          items:
            $ref: "#/components/schemas/GameEvent"
    PendingHostAction:
      type: object
      required: [actionId, nodeId, target, action, arguments]
      properties:
        actionId:
          type: string
        nodeId:
          type: string
        target:
          type: string
        action:
          type: string
        arguments: {}
    GameEvent:
      type: object
      required: [specversion, id, source, type, sequence, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
        source:
          type: string
        type:
          type: string
        subject:
          type: string
        sequence:
          type: integer
          minimum: 1
        data: {}
    SessionStatus:
      type: string
      enum:
        - running
        - waiting_input
        - waiting_effect
        - waiting_host
        - completed
        - failed
        - cancelled
    RuntimeFailure:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        nodeId:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
