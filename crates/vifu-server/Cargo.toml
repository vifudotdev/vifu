[package]
name = "vifu-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP, WebSocket, and persistent server implementation for Vifu."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vifu-server"
readme = "README.md"
rust-version.workspace = true
build = "build.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
vifu-gateway = { version = "0.1.10", path = "../vifu-gateway", default-features = false }
vifu-runtime = { version = "0.1.10", path = "../vifu-runtime", default-features = false }

[features]
default = ["local-whisper"]
local-whisper = ["vifu-gateway/local-whisper", "vifu-runtime/local-whisper"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
