[package]
name = "vifu-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Open-source Agent Endpoint Runtime for Vifu."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "cors", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
vifu-core = { path = "../vifu-core" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
