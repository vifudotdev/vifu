[package]
name = "vifu-mobile-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Vifu runtime UniFFI megazord for iOS and Android clients."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]
name = "vifu_mobile_ffi"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt"] }
uniffi.workspace = true
vifu-gateway = { path = "../vifu-gateway", default-features = false, features = ["sqlite"] }
vifu-provider-llama = { path = "../vifu-provider-llama", optional = true }
vifu-runtime = { path = "../vifu-runtime", default-features = false, features = ["sqlite"] }

[features]
default = ["local-llama", "local-whisper"]
local-llama = ["dep:vifu-provider-llama"]
local-whisper = ["vifu-gateway/local-whisper", "vifu-runtime/local-whisper"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
