[package]
name = "vifu-llama-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Optional llama.cpp UniFFI provider module for Vifu Android."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
name = "vifu_llama_ffi"

[features]
default = []
dynamic-backends = ["vifu-provider-llama/dynamic-backends"]

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "time"] }
uniffi.workspace = true
vifu-provider-llama = { path = "../vifu-provider-llama" }
vifu-runtime = { path = "../vifu-runtime", default-features = false }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
