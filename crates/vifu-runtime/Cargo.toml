[package]
name = "vifu-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Small, stateful, embeddable Agent Runtime primitives for Vifu."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/vifu-runtime"
readme = "README.md"
keywords = ["agents", "runtime", "bevy", "embedded", "stateful"]
categories = ["game-development", "development-tools"]

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
hound = { version = "3.5", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
whisper-rs = { version = "0.16", optional = true }

[features]
default = []
local-whisper = ["dep:hound", "dep:whisper-rs"]
