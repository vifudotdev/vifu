[package]
name = "vifu-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Embeddable Agent Runtime primitives for product-owned agents and endpoints."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/vifu-runtime"
readme = "README.md"
keywords = ["agents", "runtime", "bevy", "embedded", "stateful"]
categories = ["game-development", "development-tools"]

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
hound = { version = "3.5", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
web-time = "1"
whisper-rs = { version = "0.16", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
default = ["local-whisper", "sqlite"]
local-whisper = ["dep:hound", "dep:whisper-rs"]
sqlite = ["dep:rusqlite"]
