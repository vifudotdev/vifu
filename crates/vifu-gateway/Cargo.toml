[package]
name = "vifu-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Provider discovery, relay, protocol, and session support for Vifu Agent Gateway."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vifu-gateway"
readme = "README.md"
rust-version.workspace = true

[lib]
crate-type = ["lib"]
name = "vifu_gateway"

[dependencies]
futures-util = "0.3"
hound = { version = "3.5", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
whisper-rs = { version = "0.16", optional = true }

[features]
default = []
local-whisper = ["dep:hound", "dep:whisper-rs"]
