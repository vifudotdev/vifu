[package]
name = "vifu-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Provider discovery, relay, protocol, and session support for Vifu Agent Gateway."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vifu-gateway"
readme = "README.md"
rust-version.workspace = true

[lib]
crate-type = ["lib"]
name = "vifu_gateway"

[dependencies]
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
vifu-runtime = { version = "0.1.3", path = "../vifu-runtime", default-features = false }

[features]
default = ["local-whisper", "sqlite"]
local-whisper = ["vifu-runtime/local-whisper"]
sqlite = ["vifu-runtime/sqlite"]
