[package]
name = "vifu"
version = "0.1.11"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Agent Runtime, Gateway, and Server for embedded and self-hosted products."
repository.workspace = true
homepage.workspace = true
documentation = "https://vifu.dev/docs/install"
readme = "README.md"
keywords = ["agents", "runtime", "gateway", "embedded", "bevy"]
categories = ["development-tools", "game-development", "command-line-utilities"]
rust-version.workspace = true

[[bin]]
name = "vifu"
path = "src/main.rs"

[features]
default = ["local-llama", "local-whisper"]
local-llama = ["dep:vifu-provider-llama"]
local-whisper = ["vifu-gateway/local-whisper", "vifu-server/local-whisper"]

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = "0.29"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
vifu-gateway = { version = "0.1.11", path = "../vifu-gateway", default-features = false, features = ["sqlite"] }
vifu-provider-llama = { version = "0.1.11", path = "../vifu-provider-llama", optional = true }
vifu-server = { version = "0.1.11", path = "../vifu-server", default-features = false }
