[package]
name = "vifu"
version = "0.1.4"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Small, stateful, portable Agent Runtime, Gateway, and Server."
repository.workspace = true
homepage.workspace = true
documentation = "https://vifu.dev/docs/install"
readme = "README.md"
keywords = ["agents", "runtime", "gateway", "embedded", "bevy"]
categories = ["development-tools", "game-development", "command-line-utilities"]
rust-version.workspace = true

[[bin]]
name = "vifu"
path = "src/main.rs"

[features]
local-whisper = ["vifu-gateway/local-whisper"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
vifu-gateway = { version = "0.1.1", path = "../vifu-gateway", default-features = false, features = ["sqlite"] }
vifu-server = { version = "0.1.1", path = "../vifu-server" }
