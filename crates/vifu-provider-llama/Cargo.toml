[package]
name = "vifu-provider-llama"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local llama.cpp provider for the embedded Vifu runtime."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
exclude = ["examples/stardew_valley_gateway.rs"]

[dependencies]
encoding_rs = "0.8"
llama-cpp-2 = { version = "=0.1.153", default-features = false, features = ["common", "mtmd", "sampler"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }
vifu-runtime = { version = "0.1.11", path = "../vifu-runtime", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "signal"] }
vifu-gateway = { path = "../vifu-gateway", default-features = false, features = ["sqlite"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "=0.1.153", default-features = false, features = ["common", "metal", "mtmd", "sampler"] }
