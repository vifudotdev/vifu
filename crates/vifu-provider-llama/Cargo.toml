[package]
name = "vifu-provider-llama"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local llama.cpp provider for the embedded Vifu runtime."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
encoding_rs = "0.8"
llama-cpp-2 = { version = "=0.1.153", default-features = false, features = ["sampler"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt"] }
vifu-runtime = { path = "../vifu-runtime" }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "=0.1.153", default-features = false, features = ["metal", "sampler"] }
