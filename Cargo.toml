[workspace]
members = [
  "crates/vifu-core",
  "crates/vifu",
  "crates/vifu-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vifu Contributors"]
license = "Apache-2.0"
repository = "https://github.com/vifudotdev/vifu"
homepage = "https://vifu.dev"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
