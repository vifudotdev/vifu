[workspace]
members = [
  "crates/vifu-runtime",
  "crates/vifu-provider-llama",
  "crates/vifu-gateway",
  "crates/vifu-mobile-ffi",
  "crates/vifu",
  "crates/vifu-server",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["Vifu Contributors"]
license = "Apache-2.0"
repository = "https://github.com/vifudotdev/vifu"
homepage = "https://vifu.dev"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
toml = "0.9.12"
uniffi = { version = "0.32", features = ["build", "cli"] }
bevy_app = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
